name: release

# A tag is a release, and nothing else is: pushing the tag <YYYYMMDD>.<N>, on a commit of
# main, publishes that version on PyPI, as py-screen-mux, and on GitHub. Every push and pull
# request is tested by ci.yml, and publishes nothing. So:
#   git tag 20261106.1 <sha> && git push origin 20261106.1
# By hand, a dry run of any commit, on any branch, with nothing published (version <day>.0):
#   gh workflow run release.yml -R congzhangzh/py-screen [--ref <branch>] [-f ref=<sha>]
#
#   ci            ci.yml: the suite on each OS, the sanitizer, the bench gate
#   sdist         the sdist, version <YYYYMMDD>.<N>
#   wheels × OS   cibuildwheel builds each OS's wheel *from that sdist*, so the sdist is
#                 proven complete (libvterm and the licences included)
#   smoke × OS    `uv tool install` of that OS's wheel, then release/smoke.py with
#                 PYS_TERM=vterm, which fails when a wheel lacks the extension
#   bundle × OS   release/bundle.py: that OS's wheel with its own standalone Python and
#                 dependencies in one archive (nothing to install), unpacked into another
#                 folder and smoke-tested from there, with no uv or Python on PATH
#   draft         a GitHub draft release with every file
#   pypi          the wheels and the sdist to PyPI (Trusted Publishing, environment pypi)
#   release       the draft published, on the tag that started all this
# so a failure before PyPI leaves only a draft, and one after it is finished by a rerun.
on:
  push:
    tags: ['[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].*']
  workflow_dispatch:
    inputs:
      ref:
        description: The commit to build (empty = the tip of the branch the run is on)
        default: ''

permissions:
  contents: write

env:
  # one OS per runner image; the wheel each builds is the wheel its smoke job installs
  CIBW_BUILD: cp314-*
  CIBW_SKIP: '*-musllinux_*'
  CIBW_VERSION: 4.3.1

jobs:
  ci: # every test a push gets, from the one place they are written
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  sdist:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - id: v
        name: Name the release
        env:
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          sha=$(git rev-parse HEAD)
          if [ "$PUBLISH" = true ]; then
            # the version is the tag: a final release on PyPI, sorted by date
            tag=$GITHUB_REF_NAME
            if ! [[ $tag =~ ^[0-9]{8}\.[1-9][0-9]*$ ]]; then
              echo "::error::$tag is not <YYYYMMDD>.<N>"; exit 1
            fi
            # a release is a commit of main, never of another branch
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::$tag: ${sha:0:12} is not on main"; exit 1
            fi
          else
            tag=$(date -u +%Y%m%d).0     # a dry run, whose version no release ever has
          fi
          echo "release $tag from ${sha:0:12}"
          { echo "tag=$tag"; echo "version=$tag"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - name: Build the sdist
        run: |
          uv version --frozen "${{ steps.v.outputs.version }}"
          uv build --sdist
          tar -tzf dist/*.tar.gz | grep -E 'deps/libvterm/(LICENSE|src/vterm\.c)$|_vterm\.c$'
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  wheels:
    needs: sdist
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
          - { os: windows-latest, arch: AMD64 }
          - { os: windows-11-arm, arch: ARM64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist
      - uses: astral-sh/setup-uv@v6
      - name: Build the wheel from the sdist
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: uvx "cibuildwheel==$CIBW_VERSION" sdist/*.tar.gz --output-dir wheelhouse
      - name: The wheel has the engine and both licences
        run: |
          ls -l wheelhouse
          uv run --no-project --python 3.14 python - wheelhouse/*.whl <<'PY'
          import re, sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          ext = [n for n in names if re.search(r"_vterm\..*(so|pyd)$", n)]
          lic = [n for n in names if re.search(r"licenses/.*LICENSE$", n)]
          print("engine:", ext, "licences:", lic)
          sys.exit(0 if ext and len(lic) == 2 else "the wheel lacks the engine or a licence")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  smoke:
    needs: [sdist, wheels]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sdist.outputs.sha }}
          sparse-checkout: release
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v6
      - name: Install this OS's wheel, not the checkout
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
        run: |
          # uv picks the wheel built for this OS and architecture among all of them
          uv tool install --python 3.14 --find-links dist "py-screen-mux==$VERSION"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Smoke test on the vterm engine
        run: PYS_TERM=vterm uv run --no-project --python 3.14 python release/smoke.py

  bundle:
    needs: [sdist, wheels]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sdist.outputs.sha }}
          sparse-checkout: release
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v6
      - name: Build the bundle from this OS's wheel
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
        run: uv run --no-project --python 3.14 python release/bundle.py --wheels dist --version "$VERSION" --out bundles
      - name: Unpack it elsewhere and smoke-test it there, with nothing else on PATH
        run: |
          moved="$RUNNER_TEMP/moved"
          mkdir -p "$moved"
          py=$(uv python find 3.14)        # only to unpack and to drive smoke.py
          f=$(ls bundles/pys-*)
          case $f in
            *.zip) "$py" -m zipfile -e "$f" "$moved" ;;
            *) tar -xzf "$f" -C "$moved" ;;
          esac
          b=$(ls -d "$moved"/pys-*)
          ls -l "$b"
          out="$RUNNER_TEMP/sample.py"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "$(cygpath -w "$b/pys.cmd")" sample-config > "$out"
            grep -q "sample pys config" "$out"
            # what pys.cmd runs; Windows keeps its PATH (System32), the Python is by path
            PYS_TERM=vterm "$py" release/smoke.py "$b/python/python.exe" -m py_screen
          else
            "$b/bin/pys" sample-config > "$out"
            grep -q "sample pys config" "$out"
            PATH=/usr/bin:/bin PYS_TERM=vterm "$py" release/smoke.py "$b/bin/pys"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: bundles/*

  draft:
    needs: [sdist, smoke, bundle]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.draft.outputs.skip }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: draft
        name: A draft with every file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sdist.outputs.tag }}
          VERSION: ${{ needs.sdist.outputs.version }}
          SHA: ${{ needs.sdist.outputs.sha }}
        run: |
          # a commit is released once (a release's tag points at its commit)
          old=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft | not) | .tagName' | while read -r t; do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$t" --jq .sha)" = "$SHA" ]; then echo "$t"; fi
            done)
          if [ -n "$old" ]; then
            echo "::notice::${SHA:0:12} is already released as $old; nothing new"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          base=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "py-screen \`$VERSION\` from \`main\` @ [\`${SHA:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)."
            echo
            echo "**Tested:** the suite on Linux and macOS, and the RPC smoke test on Windows, on both engines (vterm, pyte); the vterm engine under ASan + UBSan (a differential fuzz run); its parse speed against the newest recorded run; then each wheel, installed, on the vterm engine (\`release/smoke.py\`)."
            echo
            echo "**Install** (needs [uv](https://docs.astral.sh/uv/); it fetches Python 3.14 if missing; the command is \`pys\`):"
            echo '```'
            echo "uv tool install py-screen-mux==$VERSION"
            echo '```'
            echo "from [PyPI](https://pypi.org/project/py-screen-mux/$VERSION/), which picks the wheel for your system, or one of these files:"
            echo
            echo "| System | Install |"
            echo "|---|---|"
            for whl in *.whl; do
              case $whl in
                *manylinux*x86_64*) os="Linux x86_64" ;;
                *manylinux*aarch64*) os="Linux aarch64" ;;
                *macosx*arm64*) os="macOS Apple Silicon" ;;
                *macosx*x86_64*) os="macOS Intel" ;;
                *win_amd64*) os="Windows x86_64" ;;
                *win_arm64*) os="Windows ARM64" ;;
                *) os=$whl ;;
              esac
              echo "| $os | \`uv tool install $base/$whl\` |"
            done
            echo
            echo "**Ready to use, nothing to install:** each archive holds its own Python 3.14, pys and its dependencies (pyte, psutil). Unpack it anywhere and run \`bin/pys\` (\`pys.cmd\` on Windows); \`README.txt\` inside says more."
            echo
            echo "| System | Download |"
            echo "|---|---|"
            for b in pys-*.tar.gz pys-*.zip; do
              [ -e "$b" ] || continue
              case $b in
                *linux-x86_64*) os="Linux x86_64" ;;
                *linux-aarch64*) os="Linux aarch64" ;;
                *macos-arm64*) os="macOS Apple Silicon" ;;
                *macos-x86_64*) os="macOS Intel" ;;
                *windows-x86_64*) os="Windows x86_64" ;;
                *windows-arm64*) os="Windows ARM64" ;;
                *) os=$b ;;
              esac
              echo "| $os | [\`$b\`]($base/$b) |"
            done
            echo
            echo "On macOS, a browser download is quarantined: \`xattr -dr com.apple.quarantine pys-*\` before the first start. Downloaded with curl, it isn't."
            echo
            echo "Elsewhere, the sdist builds with a C compiler, or runs the pure-Python pyte engine without one."
            echo
            echo "Published once, never replaced."
          } > ../notes.md
          cat ../notes.md
          # a draft left by a failed run is replaced, so a rerun starts clean (only a draft:
          # a published release of this tag would have stopped the run above)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null | grep -qx true; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "py-screen $VERSION ($TAG)" --notes-file ../notes.md ./*

  pypi:
    needs: [sdist, draft]
    if: needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/py-screen-mux/${{ needs.sdist.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: no token is stored anywhere
    steps:
      # only the sdist and the wheels: PyPI takes no other files (the bundles are on GitHub)
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a rerun after a failure past this point finds its files already there
          skip-existing: true

  release:
    needs: [sdist, draft, pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.sdist.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
