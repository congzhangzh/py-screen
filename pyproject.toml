[project]
name = "py-screen"
version = "0.1.0"
description = "A terminal workspace of my own"
readme = "README.md"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "deps/libvterm/LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pyte>=0.8.2",
]

[project.scripts]
pys = "py_screen:main"

[build-system]
# setuptools, not uv_build: uv_build has no C extensions. setup.py adds _vterm.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
