[project]
# On PyPI as py-screen (until 20261109.2 as py-screen-mux, while "pyscreen" held the name;
# py-screen-mux gets no more releases). The import is py_screen and the command pys. The
# version is set by release.yml: <YYYYMMDD>.<N>.
name = "py-screen"
version = "0.1.0"
description = "py-screen: a terminal workspace (multiplexer) of my own, with the pys command"
readme = "README.md"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "deps/libvterm/LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "pyte>=0.8.2",
    "pywinpty>=3.1; sys_platform == 'win32'",   # ConPTY; the platform layer's Windows Pty
    # off Linux, what /proc tells on Linux: a window's folder (Windows), and the processes
    # pys-agents and pys-sessions look at (agents/procs.py); the sample's widgets use it too
    "psutil>=7; sys_platform != 'linux'",
]

[project.optional-dependencies]
# psutil, which macOS and Windows get anyway (above), for Linux too: nothing there needs it
# (Linux reads /proc), the name stays so that `py-screen[stats]` keeps installing.
stats = ["psutil>=7"]

[project.urls]
Homepage = "https://github.com/congzhangzh/py-screen"
Source = "https://github.com/congzhangzh/py-screen"
Releases = "https://github.com/congzhangzh/py-screen/releases"
Issues = "https://github.com/congzhangzh/py-screen/issues"

[project.scripts]
pys = "py_screen:main"
pys-agents = "py_screen.agents.listing:main"      # which window runs which Claude Code session
pys-sessions = "py_screen.agents.sessions:main"  # save the windows, restore them after pys died

[build-system]
# setuptools, not uv_build: uv_build has no C extensions. setup.py adds _vterm.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"py_screen.agents" = ["skills/*/SKILL.md"]   # `pys-agents skills --install` links them

[dependency-groups]
dev = [
    "psutil>=7",          # tests the sample config's psutil path on every OS
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
