[project]
# On PyPI as py-screen-mux: "py-screen" is refused there as too close to the existing
# "pyscreen" (PyPI compares names without - _ .), and "pys" is taken. The import stays
# py_screen and the command pys. The version is set by release.yml: <YYYYMMDD>.<N>.
name = "py-screen-mux"
version = "0.1.0"
description = "py-screen: a terminal workspace (multiplexer) of my own, with the pys command"
readme = "README.md"
authors = [
    { name = "Cong Zhang", email = "13283869+congzhangzh@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "deps/libvterm/LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "pyte>=0.8.2",
    "pywinpty>=3.1; sys_platform == 'win32'",   # ConPTY; the platform layer's Windows Pty
]

[project.urls]
Homepage = "https://github.com/congzhangzh/py-screen"
Source = "https://github.com/congzhangzh/py-screen"
Releases = "https://github.com/congzhangzh/py-screen/releases"
Issues = "https://github.com/congzhangzh/py-screen/issues"

[project.scripts]
pys = "py_screen:main"

[build-system]
# setuptools, not uv_build: uv_build has no C extensions. setup.py adds _vterm.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
